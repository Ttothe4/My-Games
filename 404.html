<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Page Not Found — My Game Library</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
font-family:Inter,Segoe UI,Arial,sans-serif;background:#080b12;color:#f7f9ff}
.card{width:min(520px,95vw);padding:30px;border:1px solid rgba(255,255,255,.12);border-radius:24px;
background:#111722;text-align:center}.muted{color:#9ca9bc;line-height:1.5}
button{border:0;border-radius:12px;background:#6ee7ff;color:#071018;padding:11px 15px;font-weight:900;cursor:pointer}
</style>
</head>
<body><div class="card">
<div style="font-size:54px">🕹️</div><h1>That page isn't here.</h1>
<p class="muted">Go back to your Game Library and choose a game from the home screen.</p>
<button onclick="goHome()">Game Library</button>
</div>
<script>
function goHome(){
  const parts=location.pathname.split('/').filter(Boolean);
  const onGitHub=location.hostname.endsWith('.github.io');
  const base=(onGitHub && parts.length>1) ? '/' + parts[0] + '/' : '/';
  location.href=base;
}
</script>
</body></html>
